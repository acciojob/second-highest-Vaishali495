	<script>
		function secondHighest(arr) {
			//Write your code here
			let lar = arr[0], secLar = arr[1];

for(let i=1; i<arr.length; i++){
  if(arr[i] > lar){
    secLar = lar;
    lar = arr[i];
  }
}
			return secLar;
		}
